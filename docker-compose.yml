# Local stack: PostgreSQL + API with the fictional demo data.
#   cp .env.example .env      # fill in values; .env is git-ignored
#   docker compose up --build
#   open http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triage-local}
      POSTGRES_DB: triage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://triage:${POSTGRES_PASSWORD:-triage-local}@db:5432/triage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
