[project]
name = "complaint-triage-system"
version = "0.1.0"
description = "Analisis keluhan nasabah mobile banking: aspek, sentimen, urgensi, dasbor, dan agent analis SQL."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["complaint_triage*", "app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"complaint_triage/rules.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:torch.*"]
