name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triage" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://triage:triage@localhost:5432/triage_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (baseline only)
        run: docker build -t triage-api .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 triage-api
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs -X POST localhost:8000/api/classify -H 'Content-Type: application/json' \
            -d '{"text": "Transfer gagal tapi saldo terpotong"}'
          docker logs api
